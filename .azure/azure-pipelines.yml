trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
  displayName: 'Configurar Python 3.11'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Instalar Dependências (Pytest, Playwright, Faker)'

- script: |
    playwright install --with-deps chromium
  displayName: 'Instalar Navegador Chromium e Dependências do SO'

- script: |
    pytest
  displayName: 'Executar Suíte de Testes (E2E, Login, Cart)'
  # O continueOnError garante que a pipeline vá para o próximo passo (salvar o relatório)
  # mesmo que algum teste acabe falhando.
  continueOnError: true 

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/report.html'
    artifact: 'Relatorio-Pytest-HTML'
    publishLocation: 'pipeline'
  displayName: 'Salvar Relatório HTML como Artefato'
  condition: always()